<style>
:root{--ink:#fff;--mute:#8d8d95;--line:#24242b;--pink:#fe2c55;--cyan:#25f4ee;--card:rgba(14,14,18,.72);--mx:50%;--my:30%}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(254,44,85,.16),rgba(37,244,238,.07) 45%,transparent 70%)}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 70px}
.hero{position:relative;width:min(300px,76%);margin:6px auto 0;animation:drop .9s cubic-bezier(.2,.9,.2,1) both}
.hero img{display:block;width:100%;mix-blend-mode:screen}
.hero .g{position:absolute;inset:0;opacity:.0;animation:gl 4.5s steps(1) infinite}
.hero .g1{filter:drop-shadow(0 0 0 var(--cyan)) sepia(1) hue-rotate(130deg) saturate(8);transform:translateX(-4px)}
.hero .g2{filter:sepia(1) hue-rotate(305deg) saturate(9);transform:translateX(4px);animation-delay:.06s}
@keyframes gl{0%,86%,100%{opacity:0;clip-path:inset(0)}87%{opacity:.9;clip-path:inset(12% 0 62% 0)}89%{opacity:.9;clip-path:inset(58% 0 14% 0)}91%{opacity:.9;clip-path:inset(30% 0 38% 0)}93%{opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-22px) skewX(-10deg) scale(.94)}to{opacity:1;transform:none}}
.sub{text-align:center;color:var(--mute);font-size:14px;margin:2px 0 18px;min-height:20px}
.sub b{color:var(--cyan);font-weight:600}
.box,.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px}
.box{padding:14px;position:relative}
.box::before{content:"";position:absolute;inset:-1px;border-radius:21px;padding:1px;background:conic-gradient(from var(--a,0deg),var(--pink),transparent 25%,var(--cyan) 50%,transparent 75%,var(--pink));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:rgba(0,0,0,.6);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:13px 14px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,244,238,.15)}
button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:13px 16px;font-weight:800;font-style:italic;color:#fff;transition:transform .12s,opacity .2s,filter .2s}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
.go{background:#26262e}
.rand{width:100%;margin-top:10px;padding:17px;font-size:18px;letter-spacing:.3px;background:linear-gradient(100deg,var(--pink),#ff6b8b);box-shadow:0 10px 34px -10px var(--pink);position:relative;overflow:hidden}
.rand::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.hint{text-align:center;color:#55555e;font-size:12px;margin-top:9px}
#msg{min-height:20px;margin:12px 2px 0;font-size:14px;color:var(--mute);text-align:center}
#msg.err{color:#ff7a8e}
.res{margin-top:14px;display:none;perspective:900px}
.res.show{display:block;animation:pop .5s cubic-bezier(.2,.9,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) rotateX(10deg) scale(.96)}to{opacity:1;transform:none}}
.card{padding:12px;transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
.thumb{position:relative;aspect-ratio:9/16;max-height:60vh;width:100%;background:#111 center/cover no-repeat;border-radius:14px;overflow:hidden}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65));pointer-events:none}
.play{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:0;z-index:2;box-shadow:0 0 0 0 rgba(254,44,85,.6);animation:pulse 1.8s infinite}
.play svg{width:26px;fill:#fff;margin-left:3px}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(254,44,85,0)}100%{box-shadow:0 0 0 0 rgba(254,44,85,0)}}
.skel{background:linear-gradient(90deg,#111,#1d1d24,#111);background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.who{margin-top:12px;font-weight:800;font-size:16px}.who small{color:var(--cyan);font-weight:500}
.stats{display:flex;gap:16px;color:var(--mute);font-size:13px;margin-top:6px}.stats b{color:var(--ink)}
.cap{margin-top:8px;color:#dcdce2;font-size:14px;line-height:1.5;word-break:break-word;max-height:7em;overflow:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:12px;padding:4px 9px;border-radius:99px;background:rgba(37,244,238,.1);color:var(--cyan);border:1px solid rgba(37,244,238,.25)}
.acts{display:flex;gap:8px;margin-top:14px}
.dl{flex:1;background:linear-gradient(100deg,var(--cyan),#7bfbf6);color:#001;position:relative;overflow:hidden;font-size:16px}
.dl .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.2);transition:width .15s}
.dl span{position:relative}
.sm{background:#26262e}.nw{position:absolute;left:10px;top:10px;z-index:2;font-style:normal;font-weight:800;font-size:11px;padding:5px 9px;border-radius:99px;background:rgba(0,0,0,.6);color:var(--cyan);border:1px solid rgba(37,244,238,.4)}
.hist{margin-top:18px;display:none}
.hist p{font-size:13px;color:var(--mute);margin:0 2px 8px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 64px;height:96px;padding:0;border-radius:11px;background:#111 center/cover;border:1px solid var(--line);animation:pop .4s both}
.strip button.ok{border-color:var(--cyan)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:#fff;color:#000;font-weight:800;font-style:italic;padding:11px 18px;border-radius:99px;opacity:0;transition:.35s cubic-bezier(.2,.9,.2,1);z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(()=>{
const API="https://www.tikwm.com",$=id=>document.getElementById(id);
const msg=$("msg"),res=$("res"),thumb=$("thumb"),rand=$("rand"),go=$("go"),card=$("card");
let useHD=true;const src=()=>(useHD&&cur.hd)||cur.sd||cur.hd;let pool=[],cur=null,busy=false,hist=[],dlCount=0;
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* glitch ghosts of the logo */
const hero=document.querySelector(".hero");
["g g1","g g2"].forEach(c=>{const i=new Image();i.src=$("lg").src;i.className=c;i.alt="";hero.appendChild(i)});

/* rotating subtitle */
const lines=["Download TikToks <b>without watermark</b>","Tap <b>Random</b> and get a surprise","Fast. Free. <b>No lag.</b>"];let li=0;
const sub=$("sub");const rot=()=>{sub.innerHTML=lines[li++%lines.length]};rot();setInterval(rot,3200);

/* helpers */
const abs=u=>!u?"":u.startsWith("http")?u:API+(u.startsWith("/")?"":"/")+u;
const say=(t,e)=>{msg.textContent=t;msg.className=e?"err":""};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":(n||0)+"";
const lock=b=>{busy=b;rand.disabled=go.disabled=b};
let tt;const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2000)};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}};
const PX=[u=>u,u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)];
let px=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function j(u,tries=0){
  let last;
  for(let k=0;k<PX.length;k++){
    const i=(px+k)%PX.length;
    try{
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(PX[i](u),{signal:ctl.signal});clearTimeout(to);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();
      if(d.code!==0){
        if(/limit/i.test(d.msg||"")&&tries<3){await wait(1300);return j(u,tries+1)}
        throw new Error(d.msg||"Request failed");
      }
      px=i;return d.data;
    }catch(e){last=e}
  }
  throw new Error("Can't reach the server. Open this file in Chrome/Safari (not inside Claude) or upload it online. "+(last&&last.message?"("+last.message+")":""));
}

/* count-up + typewriter */
function count(el,n){if(RM){el.textContent=fmt(n);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);el.textContent=fmt(Math.round(n*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)})(t0)}
let tw;function type(el,s){clearInterval(tw);if(RM||s.length>140){el.textContent=s;return}let i=0;el.textContent="";tw=setInterval(()=>{el.textContent=s.slice(0,i+=2);if(i>=s.length)clearInterval(tw)},16)}

function show(v,fromHist){
  cur={id:v.id,hd:abs(v.hdplay),sd:abs(v.play),cover:abs(v.origin_cover||v.cover),title:(v.title||"").trim(),
    author:v.author?.nickname||v.author?.unique_id||"Unknown",handle:v.author?.unique_id||"",plays:v.play_count,likes:v.digg_count,raw:v};
  thumb.className="thumb";thumb.innerHTML="";thumb.style.backgroundImage=`url("${cur.cover}")`;
  const b=document.createElement("button");b.className="play";b.setAttribute("aria-label","Play preview");
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
  b.onclick=()=>{const vid=document.createElement("video");vid.src=src();vid.controls=true;vid.autoplay=true;vid.playsInline=true;vid.loop=true;thumb.appendChild(vid);b.remove()};
  thumb.appendChild(b);const bd=document.createElement("em");bd.className="nw";bd.textContent="✓ NO WATERMARK";thumb.appendChild(bd);$("q").textContent=cur.hd&&cur.sd?(useHD?"HD":"SD"):(cur.hd?"HD":"SD");
  $("who").innerHTML="";const n=document.createElement("span");n.textContent=cur.author+" ";const h=document.createElement("small");h.textContent=cur.handle?"@"+cur.handle:"";$("who").append(n,h);
  $("stats").innerHTML='<span>▶ <b id="c1"></b></span><span>♥ <b id="c2"></b></span>';count($("c1"),cur.plays||0);count($("c2"),cur.likes||0);
  type($("cap"),cur.title||"(no caption)");
  $("tags").innerHTML="";(cur.title.match(/#[\p{L}\p{N}_]+/gu)||[]).slice(0,6).forEach(t=>{const s=document.createElement("span");s.textContent=t;$("tags").appendChild(s)});
  $("bar").style.width="0";$("dltxt").textContent="⬇ Download";
  res.classList.remove("show");void res.offsetWidth;res.classList.add("show");
  if(!fromHist){hist=hist.filter(x=>x.id!==v.id);hist.unshift(v);hist=hist.slice(0,10);drawHist()}
  buzz(15);
}
function drawHist(){
  const s=$("strip");s.innerHTML="";$("hist").style.display=hist.length?"block":"none";
  hist.forEach(v=>{const b=document.createElement("button");b.style.backgroundImage=`url("${abs(v.cover||v.origin_cover)}")`;b.setAttribute("aria-label","Open earlier video");if(v.done)b.className="ok";b.onclick=()=>{show(v,true);scrollTo({top:0,behavior:"smooth"})};s.appendChild(b)});
}
function skeleton(){res.classList.add("show");thumb.className="thumb skel";thumb.style.backgroundImage="";thumb.innerHTML="";$("who").textContent="";$("stats").textContent="";$("cap").textContent="";$("tags").innerHTML=""}

async function random(){
  if(busy)return;lock(true);say("Finding a random video…");skeleton();
  try{
    if(pool.length<2){const rg=["PH","US","ID","BR","JP","KR","GB","TH","MX","VN"];
      const list=await j(`${API}/api/feed/list?region=${rg[Math.floor(Math.random()*rg.length)]}&count=20`);
      pool=list.filter(x=>x&&x.play).sort(()=>Math.random()-.5)}
    if(!pool.length)throw new Error("No videos found. Try again.");
    show(pool.pop());say("");
  }catch(e){res.classList.remove("show");say(e.message||"Could not load. Try again.",1)}
  lock(false);
}
rand.onclick=random;$("nx").onclick=random;
addEventListener("keydown",e=>{if(e.code==="Space"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();random()}});

go.onclick=async()=>{
  const u=$("url").value.trim();
  if(!u){say("Paste a TikTok link first, or tap Random.",1);return}
  if(!/tiktok\.com/i.test(u)){say("That doesn’t look like a TikTok link.",1);return}
  if(busy)return;lock(true);say("Fetching video…");skeleton();
  try{show(await j(`${API}/api/?url=${encodeURIComponent(u)}&hd=1`));say("")}
  catch(e){res.classList.remove("show");say(e.message||"Could not fetch that link.",1)}
  lock(false);
};
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")go.click()});

$("dl").onclick=async()=>{
  if(!cur)return;const t=$("dltxt"),bar=$("bar"),name=`tastan_${cur.id||Date.now()}.mp4`;
  t.textContent="Downloading…";bar.style.width="5%";let ok=true;
  try{
    const r=await fetch(src());if(!r.ok)throw 0;
    const total=+r.headers.get("content-length")||0,rd=r.body.getReader(),parts=[];let got=0;
    for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;bar.style.width=(total?Math.min(95,got/total*100):50)+"%"}
    const url=URL.createObjectURL(new Blob(parts,{type:"video/mp4"}));
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(_){ok=false;const a=document.createElement("a");a.href=src();a.download=name;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
  bar.style.width="100%";
  if(ok){t.textContent="Downloaded ✓";dlCount++;toast(`Saved! ${dlCount} this session 🔥`);burst();buzz([20,40,20]);const h=hist.find(x=>x.id===cur.id);if(h){h.done=1;drawHist()}}
  else{t.textContent="Opened — save it";toast("Opened in new tab — save the video")}
  setTimeout(()=>{t.textContent="⬇ Download";bar.style.width="0"},3500);
};
$("q").onclick=()=>{if(!cur||!(cur.hd&&cur.sd)){toast("Only one quality available");return}useHD=!useHD;$("q").textContent=useHD?"HD":"SD";toast(useHD?"HD, no watermark":"Standard, no watermark")};
$("cp").onclick=async()=>{if(!cur)return;try{await navigator.clipboard.writeText(cur.title);toast("Caption copied ✓")}catch(_){toast("Press & hold the caption")}};

/* 3D tilt + cursor glow */
const root=document.documentElement;
addEventListener("pointermove",e=>{root.style.setProperty("--mx",e.clientX+"px");root.style.setProperty("--my",e.clientY+"px");
  if(RM||e.pointerType!=="mouse")return;const r=card.getBoundingClientRect();
  if(e.clientY<r.top-60||e.clientY>r.bottom+60){card.style.transform="";return}
  const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`rotateY(${x*8}deg) rotateX(${-y*6}deg)`},{passive:true});
card.addEventListener("pointerleave",()=>card.style.transform="");

/* canvas: slash streaks + confetti (single rAF loop, pauses when hidden) */
const cv=$("fx"),cx=cv.getContext("2d");let W,H,dpr=Math.min(devicePixelRatio||1,2);
const size=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener("resize",size);
const S=[];const mk=(init)=>({x:Math.random()*W*1.4-W*.2,y:init?Math.random()*H:-80,l:60+Math.random()*140,v:3+Math.random()*5,c:Math.random()<.5?"37,244,238":"254,44,85",a:.12+Math.random()*.3});
const N=RM?0:(W<600?14:26);for(let i=0;i<N;i++)S.push(mk(1));
let P=[];
function burst(){if(RM)return;const r=$("dl").getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top;
  for(let i=0;i<46;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,s=4+Math.random()*9;P.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:3+Math.random()*5,h:8+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:Math.random()<.5?"#25f4ee":Math.random()<.5?"#fe2c55":"#fff",life:1})}}
let on=true;document.addEventListener("visibilitychange",()=>{on=!document.hidden;if(on)loop()});
function loop(){if(!on)return;cx.clearRect(0,0,W,H);cx.lineWidth=2;
  for(const s of S){s.y+=s.v;s.x-=s.v*.28;if(s.y>H+80)Object.assign(s,mk(0));
    const g=cx.createLinearGradient(s.x,s.y,s.x+s.l*.28,s.y-s.l);g.addColorStop(0,`rgba(${s.c},${s.a})`);g.addColorStop(1,`rgba(${s.c},0)`);
    cx.strokeStyle=g;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x+s.l*.28,s.y-s.l);cx.stroke()}
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.012;if(p.life<=0){P.splice(i,1);continue}
    cx.save();cx.globalAlpha=p.life;cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  requestAnimationFrame(loop)}
loop();
})();
</script>
