<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Tiktokyo – TikTok Video Downloader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23000%27/%3E%3Cpath d=%27M7 9h18v4h-7v11h-4V13H7z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<style>
:root{--k:#000;--w:#fff;--g:#6b6b6b;--l:#e6e6e6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--k);color:var(--w);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
header{background:var(--w);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;text-align:center;border-bottom:1px solid #ddd}
.brand{display:inline-block;font-size:38px;font-weight:900;letter-spacing:-1.5px;color:var(--k);line-height:1;animation:drop .8s cubic-bezier(.2,.9,.2,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
main{max-width:520px;margin:0 auto;padding:34px 18px 70px;text-align:center}
h1{font-size:clamp(28px,8vw,38px);line-height:1.15;font-weight:800;letter-spacing:-.5px;animation:up .6s .1s both cubic-bezier(.2,.9,.2,1)}
.sub{color:#cfcfcf;font-size:16px;line-height:1.5;margin:14px auto 26px;max-width:380px;animation:up .6s .2s both cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.field{display:flex;gap:8px;padding:6px;border:2px solid var(--w);border-radius:14px;background:var(--w);transition:box-shadow .2s;animation:up .6s .3s both cubic-bezier(.2,.9,.2,1)}
.field:focus-within{box-shadow:5px 5px 0 #777}
input{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:10px;background:transparent;color:var(--k)}
input::placeholder{color:#8a8a8a}
button{font:inherit;cursor:pointer;border:0;border-radius:11px;font-weight:700;transition:transform .12s,background .2s,box-shadow .2s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:3px solid #aaa;outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
.paste{width:50px;flex:0 0 50px;background:var(--k);color:var(--w);display:grid;place-items:center;padding:0}
.paste svg{width:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.main{width:100%;margin-top:14px;padding:17px;font-size:17px;letter-spacing:2px;text-transform:uppercase;background:var(--w);color:var(--k);border-radius:14px;position:relative;overflow:hidden;animation:up .6s .4s both cubic-bezier(.2,.9,.2,1)}
.main::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.main:hover{box-shadow:5px 5px 0 #777}
#msg{min-height:22px;margin-top:14px;font-size:14px;color:#bbb}
#msg.err{color:#ff8a8a}
.res{margin-top:10px;display:none;text-align:left}
.res.show{display:block;animation:pop .45s cubic-bezier(.2,.9,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.card{border:2px solid var(--k);border-radius:18px;padding:12px;background:var(--w);box-shadow:6px 6px 0 #555;color:var(--k)}
.thumb{position:relative;aspect-ratio:9/16;max-height:58vh;width:100%;background:#eee center/cover no-repeat;border-radius:12px;overflow:hidden}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.55));pointer-events:none}
.play{position:absolute;inset:0;margin:auto;width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;padding:0;z-index:2;animation:pulse 1.8s infinite}
.play svg{width:26px;fill:#000;margin-left:3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%,100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.nw{position:absolute;left:10px;top:10px;z-index:2;font-style:normal;font-weight:800;font-size:11px;padding:5px 9px;border-radius:99px;background:var(--w);color:var(--k)}
.skel{background:linear-gradient(90deg,#eee,#f8f8f8,#eee);background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.who{margin-top:12px;font-weight:800;font-size:16px}.who small{color:var(--g);font-weight:500}
.stats{display:flex;gap:16px;color:var(--g);font-size:13px;margin-top:5px}.stats b{color:var(--k)}
.cap{margin-top:8px;color:#222;font-size:14px;line-height:1.5;word-break:break-word;max-height:7em;overflow:auto}
.acts{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:14px}
.acts button{padding:14px 10px;font-size:15px;border:2px solid var(--k);background:var(--w);color:var(--k);position:relative;overflow:hidden}
.acts button.dark{background:var(--k);color:var(--w)}
.acts button:hover{box-shadow:3px 3px 0 #9a9a9a}
.bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(128,128,128,.4);transition:width .15s}
.acts span{position:relative}
 .sheet{position:fixed;inset:0;z-index:7;display:none}
.sheet.on{display:block}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;color:#000;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:slide .35s cubic-bezier(.2,.9,.2,1) both}
@keyframes slide{from{transform:translateY(100%)}}
.panel h2{font-size:20px;font-weight:800}
.note{color:#6b6b6b;font-size:13px;line-height:1.45;margin:6px 0 14px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;margin-top:10px;padding:15px 16px;border:2px solid #000;background:#fff;color:#000;position:relative;overflow:hidden;text-align:left}
.opt.dark{background:#000;color:#fff}
.opt b{position:relative;font-size:17px}.opt span{position:relative;font-size:13px;font-weight:500;opacity:.75}
.opt .bar{background:rgba(128,128,128,.45)}
.cancel{width:100%;margin-top:12px;padding:12px;background:transparent;color:#6b6b6b}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:var(--w);color:var(--k);font-weight:700;padding:12px 20px;border-radius:99px;opacity:0;transition:.35s cubic-bezier(.2,.9,.2,1);z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header><div class="brand">Tiktokyo</div></header>
<main>
  <h1>TikTok Video Downloader Online</h1>
  <p class="sub">Download TikTok videos without watermark (MP4 &amp; MP3)</p>
  <div class="field">
    <input id="url" type="url" inputmode="url" placeholder="Insert TikTok link here..." autocomplete="off">
    <button class="paste" id="paste" aria-label="Paste link"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/></svg></button>
  </div>
  <button class="main" id="go">Download</button>
  <p id="msg" role="status"></p>

  <section class="res" id="res">
    <div class="card">
      <div class="thumb" id="thumb"></div>
      <div class="who" id="who"></div>
      <div class="stats" id="stats"></div>
      <p class="cap" id="cap"></p>
      <div class="acts">
        <button class="dark" id="again">⬇ Download</button>
        <button id="cp">Copy caption</button>
      </div>
    </div>
  </section>
</main>
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="shade" id="shade"></div>
  <div class="panel" role="dialog" aria-label="Choose format">
    <h2>Download as</h2>
    <p class="note">Saved exactly as the original file. No re-encoding, so resolution and FPS stay the same.</p>
    <button class="opt dark" id="mp4"><i class="bar"></i><b>▶ MP4 Video</b><span id="mp4s">Original HD</span></button>
    <button class="opt" id="mp3"><i class="bar"></i><b>♪ MP3 Audio</b><span id="mp3s">Original sound</span></button>
    <button class="cancel" id="cancel">Cancel</button>
  </div>
</div>
<div class="toast" id="toast"></div><canvas id="cf"></canvas>

<script>
(()=>{
const API="https://www.tikwm.com",$=id=>document.getElementById(id);
const msg=$("msg"),res=$("res"),thumb=$("thumb"),go=$("go");
let cur=null,busy=false;
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;


const abs=u=>!u?"":u.startsWith("http")?u:API+(u.startsWith("/")?"":"/")+u;
const say=(t,e)=>{msg.textContent=t;msg.className=e?"err":""};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":(n||0)+"";
let tt;const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2200)};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}};
const src=()=>cur.hd||cur.sd;
const mb=n=>n?(n/1048576).toFixed(1)+" MB":"";

const PX=[u=>u,u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)];
let px=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function j(u,tries=0){
  let last;
  for(let k=0;k<PX.length;k++){const i=(px+k)%PX.length;
    try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(PX[i](u),{signal:ctl.signal});clearTimeout(to);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();
      if(d.code!==0){if(/limit/i.test(d.msg||"")&&tries<3){await wait(1300);return j(u,tries+1)}throw new Error(d.msg||"Request failed")}
      px=i;return d.data}catch(e){last=e}}
  throw new Error("Can't reach the server. Open this file in Chrome/Safari (not inside Claude) or upload it online. "+(last&&last.message?"("+last.message+")":""));
}

function count(el,n){if(RM){el.textContent=fmt(n);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);el.textContent=fmt(Math.round(n*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)})(t0)}

function show(v){
  cur={id:v.id,hd:abs(v.hdplay),sd:abs(v.play),hds:v.hd_size||v.size,mp3:abs(v.music),cover:abs(v.origin_cover||v.cover),title:(v.title||"").trim(),
    author:v.author?.nickname||v.author?.unique_id||"Unknown",handle:v.author?.unique_id||"",plays:v.play_count,likes:v.digg_count};
  thumb.className="thumb";thumb.innerHTML="";thumb.style.backgroundImage=`url("${cur.cover}")`;
  const b=document.createElement("button");b.className="play";b.setAttribute("aria-label","Play preview");
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
  b.onclick=()=>{const vid=document.createElement("video");vid.src=src();vid.controls=true;vid.autoplay=true;vid.playsInline=true;vid.loop=true;thumb.appendChild(vid);b.remove()};
  thumb.appendChild(b);
  const bd=document.createElement("em");bd.className="nw";bd.textContent="✓ NO WATERMARK";thumb.appendChild(bd);
  $("who").innerHTML="";const n=document.createElement("span");n.textContent=cur.author+" ";const h=document.createElement("small");h.textContent=cur.handle?"@"+cur.handle:"";$("who").append(n,h);
  $("stats").innerHTML='<span>▶ <b id="c1"></b></span><span>♥ <b id="c2"></b></span>';count($("c1"),cur.plays||0);count($("c2"),cur.likes||0);
  $("cap").textContent=cur.title||"(no caption)";
  $("mp3").style.display=cur.mp3?"":"none";
  $("mp4s").textContent="Original "+(cur.hd?"HD":"quality")+(mb(cur.hds)?" · "+mb(cur.hds):"");
  res.classList.remove("show");void res.offsetWidth;res.classList.add("show");
  buzz(15);setTimeout(()=>res.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"}),60);
}
function skeleton(){res.classList.add("show");thumb.className="thumb skel";thumb.style.backgroundImage="";thumb.innerHTML="";$("who").textContent="";$("stats").textContent="";$("cap").textContent=""}

go.onclick=async()=>{
  const u=$("url").value.trim();
  if(!u){say("Paste a TikTok link first.",1);return}
  if(!/tiktok\.com/i.test(u)){say("That doesn’t look like a TikTok link.",1);return}
  if(busy)return;busy=go.disabled=true;say("Fetching video…");skeleton();
  try{show(await j(`${API}/api/?url=${encodeURIComponent(u)}&hd=1`));say("");setTimeout(openSheet,350)}
  catch(e){res.classList.remove("show");say(e.message||"Could not fetch that link.",1)}
  busy=go.disabled=false;
};
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")go.click()});

$("paste").onclick=async()=>{
  try{const t=await navigator.clipboard.readText();if(!t)throw 0;$("url").value=t.trim();toast("Link pasted");if(/tiktok\.com/i.test(t))go.click()}
  catch(_){$("url").focus();toast("Long-press the box and tap Paste")}
};

async function save(btn,url,name,type){
  const bar=btn.querySelector(".bar"),t=btn.querySelector("span"),old=t.textContent;
  t.textContent="Downloading…";bar.style.width="5%";let ok=true;
  try{
    const r=await fetch(url);if(!r.ok)throw 0;
    const total=+r.headers.get("content-length")||0,rd=r.body.getReader(),parts=[];let got=0;
    for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;bar.style.width=(total?Math.min(95,got/total*100):50)+"%"}
    const u=URL.createObjectURL(new Blob(parts,{type}));
    const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
  }catch(_){ok=false;const a=document.createElement("a");a.href=url;a.download=name;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
  bar.style.width="100%";
  if(ok){setTimeout(closeSheet,1400);t.textContent="Saved ✓";toast("Saved! Original quality 🔥");burst();buzz([20,40,20])}
  else{t.textContent="Opened — save it";toast("Opened in new tab — save the file")}
  setTimeout(()=>{t.textContent=old;bar.style.width="0"},3500);
}
$("mp4").onclick=()=>cur&&save($("mp4"),src(),`tiktokyo_${cur.id||Date.now()}.mp4`,"video/mp4");
$("mp3").onclick=()=>cur&&cur.mp3&&save($("mp3"),cur.mp3,`tiktokyo_${cur.id||Date.now()}.mp3`,"audio/mpeg");
const sh=$("sheet");
function openSheet(){if(!cur)return;sh.classList.add("on");sh.setAttribute("aria-hidden","false");$("mp4").focus()}
function closeSheet(){sh.classList.remove("on");sh.setAttribute("aria-hidden","true")}
$("again").onclick=openSheet;$("cancel").onclick=closeSheet;$("shade").onclick=closeSheet;
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("cp").onclick=async()=>{if(!cur)return;try{await navigator.clipboard.writeText(cur.title);toast("Caption copied ✓")}catch(_){toast("Press & hold the caption")}};

/* confetti (black & white), runs only while particles exist */
const cv=$("cf"),cx=cv.getContext("2d");let P=[],run=false;
function burst(){if(RM)return;cv.width=innerWidth;cv.height=innerHeight;const r=$("mp4").getBoundingClientRect();
  for(let i=0;i<50;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,s=4+Math.random()*9;P.push({x:r.left+r.width/2,y:r.top,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:3+Math.random()*5,h:8+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:Math.random()<.5?"#fff":"#888",l:1})}
  if(!run){run=true;requestAnimationFrame(step)}}
function step(){cx.clearRect(0,0,cv.width,cv.height);
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.012;if(p.l<=0){P.splice(i,1);continue}
    cx.save();cx.globalAlpha=p.l;cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  if(P.length)requestAnimationFrame(step);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
})();
</script>
</body></html>
